server:
  nodeId: macbook-local
  host: 127.0.0.1
  port: 11435
  basePath: /
  requestBodyLimit: 8mb
  https:
    enabled: false
    certPath:
    keyPath:
    caPath:

ollama:
  baseUrl: http://127.0.0.1:11434
  openAiCompatiblePath: /v1/chat/completions
  nativeApiBasePath: /api
  # Was 3m. The router config reference doesn't expose a per-model
  # keepAlive override (only global), so this applies to every model —
  # but qwen3:4b (triage + simple_chat, hit on nearly every request) is
  # the one this actually matters for. 3 minutes was short enough that a
  # single heavier request (planner/coder) evicting it to free memory
  # meant the very next "hi" paid a full cold-load again. 30m keeps it
  # resident through normal idle gaps between messages. The heavy
  # exclusive models (qwen3:8b, qwen2.5-coder:7b) are already penalised
  # in the router's scoring while running (exclusive: true → -80 per
  # running job), so they still get displaced under real memory
  # pressure regardless of this value — this mainly protects the small,
  # constantly-used model from unnecessary reloading.
  keepAlive: 30m
  requestTimeoutMs: 300000

gpu:
  # Apple Silicon uses unified memory shared with the CPU — there is no
  # discrete VRAM pool for the detector to report, hence provider: none /
  # vramTotalMb: 0 below. Ollama still uses the Metal backend automatically
  # regardless of this block; these fields only feed this router's own
  # scheduling heuristics.
  provider: none
  name: "Apple Silicon (M-series) — unified memory, no discrete VRAM to report"
  vramTotalMb: 0
  vramSafetyReserveMb: 0
  maxGpuUtilizationPct: 100
  requireGpuOnlyByDefault: false
  monitor:
    enabled: false
    intervalMs: 5000
    nvidiaSmiPath: nvidia-smi

router:
  defaultMode: auto
  syncMaxQueueTimeMs: 250
  heavyLoadQueueDepth: 1
  heavyLoadGpuFreeMbThreshold: 0
  defaultTaskType: unknown
  classification:
    # Use the stronger small chat model for ambiguous task classification.
    # Explicit tool/file requests are still handled by the orchestrator's
    # deterministic keyword guard before this model is called.
    mode: heuristic
    classifierTimeoutMs: 1500

jobs:
  store: memory
  resultTtlSeconds: 86400
  maxAttempts: 2
  cleanupIntervalMs: 60000

models:
  # Fast triage/classification. Native tool-calling and much better
  # instruction-following than smollm2:360m at a nearly identical footprint.
  - name: qwen3:0.6b
    sizeGb: 0.4
    purpose: [triage, classification]
    priority: 40
    maxConcurrent: 1
    defaultContext: 2048
    maxContext: 4096
    timeoutMs: 30000
    costClass: low
    exclusive: false
    allowWhenBusy: true

  # General conversational replies and summarization. Small enough to stay
  # resident without crowding out the coder/8B model.
  - name: qwen3:4b
    sizeGb: 2.5
    purpose: [simple_chat, summarize]
    priority: 45
    maxConcurrent: 1
    defaultContext: 4096
    maxContext: 8192
    timeoutMs: 300000
    costClass: low
    exclusive: false
    allowWhenBusy: true

  # Dedicated code model — still the best code-specialized option at this
  # memory tier; no small dense Qwen3-Coder exists yet (only 30B/480B MoE,
  # which need far more than 16GB of unified memory).
  - name: qwen2.5-coder:7b
    sizeGb: 4.7
    purpose: [code_generate, code_review, code_fix]
    priority: 55
    maxConcurrent: 1
    defaultContext: 4096
    maxContext: 8192
    timeoutMs: 300000
    costClass: high
    exclusive: true
    allowWhenBusy: false

  # Planner/critic/tool-calling workhorse. Native tool calling makes this
  # the model actually used for generate_plan/evaluate_step in agent.py —
  # this is what fixes the malformed-JSON PlanStep crashes. Context ceiling
  # raised for the large_context route; default kept modest so ordinary
  # tool_use/agentic_reasoning calls don't pay for a KV cache they don't need.
  #
  # Was 4096. agent.py now sends "think": false on generate_plan/
  # evaluate_step (the tool_use route's only two callers) so this no
  # longer has to absorb an unbounded <think> block, but 4096 was still
  # tight for sys_prompt + a multi-step JSON plan + generation headroom —
  # that combination hitting the ceiling mid-JSON is what produced the
  # truncated-output 500s. 8192 gives real margin without paying for the
  # full 32768 large_context KV cache on every ordinary planning call.
  - name: qwen3:8b
    sizeGb: 5.2
    purpose: [tool_use, agentic_reasoning, large_context]
    priority: 50
    maxConcurrent: 1
    defaultContext: 8192
    maxContext: 32768
    timeoutMs: 240000
    costClass: high
    exclusive: true
    allowWhenBusy: false

routes:
  triage: [qwen3:4b]
  simple_chat: [qwen3:4b]
  summarize: [qwen3:4b]
  code_generate: [qwen2.5-coder:7b]
  code_review: [qwen2.5-coder:7b]
  code_fix: [qwen2.5-coder:7b]
  agentic_reasoning: [qwen3:8b]
  large_context: [qwen3:8b]
  tool_use: [qwen3:8b]
  unknown: [qwen3:0.6b]

queue:
  globalMaxConcurrent: 1
  globalMaxQueued: 50
  perUserMaxQueued: 10
  defaultPriority: normal
  timeoutMs: 300000